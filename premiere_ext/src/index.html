<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mudkit</title>
<style>
  /* Style calque sur Premiere Pro : le fond s'adapte au theme Apparence
     de l'utilisateur (lu au demarrage), controles style Adobe. */
  :root {
    --bg: #232323;
    --panel: #2D2D2D;
    --panel-h: #383838;
    --line: #3D3D3D;
    --input: #1B1B1B;
    --text: #D6D6D6;
    --dim: #999999;
    --accent: #1473E6;
    --accent-h: #2B84EE;
    --green: #3DA35D;
    --red: #EB5757;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    padding: 12px;
    user-select: none;
  }
  input[type=text] { user-select: text; }

  label.t {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: var(--dim);
    margin: 12px 0 5px;
  }
  label.t:first-of-type { margin-top: 2px; }

  input[type=text] {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--input);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 8px;
    outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  input::placeholder { color: #6E6E6E; }

  .seg { display: grid; gap: 5px; }
  .seg button {
    font: inherit;
    font-size: 11.5px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 8px;
    cursor: pointer;
  }
  .seg button:hover { background: var(--panel-h); }
  .seg button.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 12px;
    cursor: pointer;
    font-size: 12px;
  }
  .check input { accent-color: var(--accent); width: 14px; height: 14px; }

  .cta {
    width: 100%;
    margin-top: 14px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: #FFFFFF;
    background: var(--accent);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 8px;
    cursor: pointer;
  }
  .cta:hover { background: var(--accent-h); }
  .cta:disabled { opacity: .4; cursor: default; }

  .btn {
    width: 100%;
    margin-top: 6px;
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 7px;
    cursor: pointer;
  }
  .btn:hover { background: var(--panel-h); }

  .bar {
    height: 4px;
    border-radius: 2px;
    background: var(--input);
    border: 1px solid var(--line);
    overflow: hidden;
    margin-top: 12px;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .25s;
  }
  .bar.indet i {
    width: 30% !important;
    animation: indet 1.1s ease-in-out infinite alternate;
  }
  @keyframes indet {
    from { transform: translateX(-40%); }
    to   { transform: translateX(280%); }
  }

  #status {
    margin-top: 8px;
    color: var(--dim);
    font-size: 11.5px;
    line-height: 1.5;
    word-break: break-word;
  }
  #status.ok { color: var(--green); }
  #status.err { color: var(--red); }

  .cutrow {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 7px;
  }
  .cutrow input { flex: 1; min-width: 0; }
  .cutrow span { color: var(--dim); }

  .foot {
    margin-top: 12px;
    font-size: 10px;
    color: #6E6E6E;
  }
  .foot a { color: var(--dim); }
  .foot a:hover { color: var(--text); }
  .hidden { display: none; }
</style>
</head>
<body>

  <label class="t">Lien</label>
  <input id="url" type="text" spellcheck="false"
         placeholder="Colle un lien — YouTube, TikTok…">

  <label class="t">Format</label>
  <div class="seg" id="seg">
    <button data-v="h264" class="on">MP4 · 1080p montage (H.264)</button>
    <button data-v="max">MP4 · qualité max (4K, converti si besoin)</button>
    <button data-v="mp3">MP3 · audio seul</button>
  </div>

  <label class="check">
    <input type="checkbox" id="cut">
    Passage seulement (début → fin)
  </label>
  <div id="cutrow" class="cutrow hidden">
    <input id="t-in" type="text" spellcheck="false" placeholder="0:00">
    <span>→</span>
    <input id="t-out" type="text" spellcheck="false" placeholder="1:30">
  </div>

  <label class="t">À l'import</label>
  <div class="seg" id="act">
    <button data-v="insert" class="on">Timeline · insérer au curseur</button>
    <button data-v="overwrite">Timeline · écraser au curseur</button>
    <button data-v="bin">Chutier « Mudkit » seulement</button>
  </div>

  <button id="go" class="cta">Télécharger et importer</button>
  <button id="cancel" class="btn hidden">Annuler</button>

  <div class="bar hidden" id="bar"><i></i></div>
  <div id="status"></div>

  <div class="foot">Mudkit · fichiers dans Vidéos\Mudkit\Premiere ·
    <a id="upd" href="#">MàJ yt-dlp</a></div>

<script src="panel.js"></script>
</body>
</html>
