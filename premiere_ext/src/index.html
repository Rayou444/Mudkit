<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mudkit</title>
<style>
  /* Palette et typo entierement pilotees par panel.js depuis appSkinInfo :
     toute variable definie ici est une VALEUR DE SECOURS, remplacee au
     demarrage par la vraie couleur/police du theme Premiere. Ne pas ajouter
     de variable ici sans l'ajouter aussi dans setTheme() de panel.js. */
  :root {
    /* Replis indispensables : des noms de fichiers venus de YouTube/TikTok
       contiennent des emoji, du CJK ou de la ponctuation pleine chasse
       (U+FF1A deux-points, U+FF5C barre) qu'Adobe Clean et Segoe UI ne
       couvrent pas -> sinon carre vide sous la vignette. */
    --font:    "Adobe Clean", "Segoe UI", "Segoe UI Symbol", "Segoe UI Emoji",
               "Yu Gothic UI", "Malgun Gothic", "Microsoft YaHei UI",
               system-ui, sans-serif;
    --fs:      11px;
    --bg:      #1E1E1E;   /* fond du panneau           */
    --side:    #242424;   /* colonne de gauche         */
    --panel:   #282828;   /* barres haut / bas         */
    --row-h:   #303030;   /* survol de ligne           */
    --row-s:   #3A3A3A;   /* ligne selectionnee        */
    --line:    #383838;   /* filets                    */
    --input:   #161616;   /* champs, fond de vignette  */
    --text:    #D2D2D2;
    --dim:     #969696;
    --faint:   #6C6C6C;
    --accent:  #1473E6;
    --accent-h:#2B84EE;
    --green:   #3DA35D;
    --red:     #EB5757;
    --star:    #E5A32E;
    --tw: 116px;          /* largeur de vignette, pilotee par le slider */
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:var(--font); font-size:var(--fs);
    color:var(--text); background:var(--bg);
    user-select:none; display:flex; flex-direction:column; overflow:hidden;
  }
  input[type=text] { user-select:text; }
  .hidden { display:none !important; }

  /* Toutes les icones sont des SVG inline en currentColor : aucun glyphe
     Unicode, donc plus de carres "tofu" quand la police ne le couvre pas. */
  svg.ic { width:13px; height:13px; display:block; flex:0 0 auto; }

  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--row-s); border-radius:6px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover { background:var(--dim); background-clip:content-box; }

  /* ------------------------------ barre titre --------------------------- */
  .titlebar {
    flex:0 0 auto; display:flex; align-items:center; gap:5px;
    padding:6px 8px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  .titlebar .ttl { font-size:12px; font-weight:600; letter-spacing:.2px; }
  .titlebar .sp { flex:1; }

  .pill {
    display:flex; align-items:center; gap:5px;
    font:inherit; font-size:11px; font-weight:600; color:#FFF;
    background:var(--accent); border:0; border-radius:11px;
    padding:4px 11px; cursor:pointer;
  }
  .pill:hover { background:var(--accent-h); }

  .ghost {
    display:flex; align-items:center; justify-content:center;
    width:23px; height:23px; color:var(--dim);
    background:transparent; border:1px solid transparent; border-radius:3px;
    cursor:pointer;
  }
  .ghost:hover { color:var(--text); background:var(--row-h); border-color:var(--line); }
  .ghost.on { color:#FFF; background:var(--accent); border-color:var(--accent); }
  .ghost.star.on { color:var(--star); background:transparent; border-color:var(--line); }

  /* --------------------------------- corps ------------------------------ */
  .main { flex:1 1 auto; min-height:0; display:flex; }

  .side {
    flex:0 0 auto; width:168px; min-width:112px; max-width:60%;
    background:var(--side); display:flex; flex-direction:column; min-height:0;
  }
  .sidetop { flex:0 0 auto; display:flex; gap:4px; padding:6px 6px 5px; align-items:center; }

  .searchwrap { flex:1; min-width:0; position:relative; display:flex; align-items:center; }
  .searchwrap svg.ic { position:absolute; left:5px; color:var(--faint); pointer-events:none; width:11px; height:11px; }
  .search {
    width:100%; font:inherit; color:var(--text);
    background:var(--input); border:1px solid var(--line); border-radius:3px;
    padding:3px 6px 3px 20px; outline:none;
  }
  .search:focus { border-color:var(--accent); }
  .search::placeholder { color:var(--faint); }

  .kinds { flex:0 0 auto; display:flex; gap:2px; padding:0 6px 6px; }
  .kinds button {
    flex:1; display:flex; align-items:center; justify-content:center;
    height:20px; font:inherit; font-size:10px; color:var(--dim);
    background:var(--input); border:1px solid var(--line); border-radius:3px;
    cursor:pointer;
  }
  .kinds button:hover { color:var(--text); }
  .kinds button.on { color:#FFF; background:var(--accent); border-color:var(--accent); }

  .tree { flex:1 1 auto; min-height:0; overflow:auto; padding-bottom:6px; }

  /* Lignes d'arbre sans filet de separation : c'est ce que fait Premiere
     dans le panneau Projet, seul le survol / la selection marque la ligne. */
  .node {
    display:flex; align-items:center; gap:4px; height:21px;
    padding-right:6px; cursor:pointer; white-space:nowrap;
  }
  .node:hover { background:var(--row-h); }
  .node.sel { background:var(--row-s); }
  .node.root { font-weight:600; }
  .node .tw {
    display:flex; align-items:center; justify-content:center;
    width:13px; height:13px; color:var(--faint);
    transition:transform .12s; flex:0 0 auto;
  }
  .node .tw.open { transform:rotate(90deg); }
  .node .tw.leaf { visibility:hidden; }
  .node .fic { color:var(--dim); display:flex; flex:0 0 auto; }
  .node.sel .fic, .node:hover .fic { color:var(--text); }
  .node .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .node .ct { flex:0 0 auto; font-size:9.5px; color:var(--faint); }

  .split { flex:0 0 auto; width:1px; cursor:col-resize; background:var(--line); position:relative; }
  .split::after { content:""; position:absolute; left:-2px; right:-2px; top:0; bottom:0; }
  .split:hover { background:var(--accent); }

  .content { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }

  /* -------------------------------- grille ------------------------------ */
  #grid {
    flex:1 1 auto; min-height:0; overflow:auto; padding:8px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(var(--tw), 1fr));
    gap:9px 8px; align-content:start;
  }

  .tile { position:relative; cursor:grab; }
  .tile:active { cursor:grabbing; }
  .tile .th {
    position:relative; width:100%; padding-top:56.25%;
    background:var(--input) no-repeat center center; background-size:cover;
    border:1px solid var(--line); border-radius:2px; overflow:hidden;
  }
  .tile:hover .th { border-color:var(--dim); }
  .tile.sel .th { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .tile.playing .th { border-color:var(--green); box-shadow:0 0 0 1px var(--green); }
  .tile .glyph {
    position:absolute; left:0; right:0; top:0; bottom:0;
    display:flex; align-items:center; justify-content:center; color:#4E4E4E;
  }
  .tile .glyph svg.ic { width:22px; height:22px; }
  .tile .dur {
    position:absolute; right:3px; bottom:3px; font-size:9px; padding:0 3px;
    border-radius:2px; background:rgba(0,0,0,.78); color:#EEE;
  }
  .tile .pos { position:absolute; left:0; bottom:0; height:2px; background:var(--green); width:0; }
  .tile .add {
    position:absolute; left:3px; top:3px; width:17px; height:17px;
    display:flex; align-items:center; justify-content:center;
    border-radius:2px; background:rgba(0,0,0,.65); color:#FFF;
    opacity:0; transition:opacity .12s;
  }
  .tile .add svg.ic { width:11px; height:11px; }
  .tile:hover .add { opacity:1; }
  .tile .add:hover { background:var(--accent); }

  .meta { display:flex; align-items:center; gap:4px; margin-top:3px; }
  .meta .badge { display:flex; flex:0 0 auto; }
  .meta .badge svg.ic { width:10px; height:10px; }
  .meta .badge.audio { color:#4FB477; }
  .meta .badge.video { color:#5B9BE8; }
  .meta .badge.image { color:#B07BD4; }
  .meta .badge.mogrt { color:#E5A32E; }
  .meta .nm {
    flex:1; min-width:0; font-size:10.5px; color:var(--dim);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .tile.sel .meta .nm { color:var(--text); }
  .meta .fav { flex:0 0 auto; display:flex; color:#454545; cursor:pointer; }
  .meta .fav svg.ic { width:11px; height:11px; }
  .meta .fav:hover { color:var(--star); }
  .meta .fav.on { color:var(--star); }

  #more { grid-column:1/-1; text-align:center; color:var(--faint); font-size:10.5px; padding:8px; }
  .empty {
    grid-column:1/-1; padding:30px 16px; text-align:center;
    color:var(--faint); font-size:11px; line-height:1.7;
  }
  .empty b { color:var(--text); }

  /* ------------------------------ barre bas ----------------------------- */
  .statusbar {
    flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:4px 8px; border-top:1px solid var(--line); background:var(--panel);
    font-size:10px; color:var(--faint);
  }
  .statusbar input[type=range] {
    -webkit-appearance:none; height:12px; background:transparent; cursor:pointer;
  }
  .statusbar input[type=range]::-webkit-slider-runnable-track {
    height:2px; background:var(--line); border-radius:1px;
  }
  .statusbar input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:9px; height:9px; border-radius:50%;
    background:var(--dim); margin-top:-3.5px;
  }
  .statusbar input[type=range]:hover::-webkit-slider-thumb { background:var(--text); }
  #size { width:64px; }
  #vol  { width:52px; }
  #vol::-webkit-slider-thumb { background:var(--accent); }
  .statusbar .msg {
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:10.5px;
  }
  .statusbar .msg.err { color:var(--red); }
  .statusbar .msg.ok  { color:var(--green); }
  .modes { display:flex; }
  .modes button {
    font:inherit; font-size:10px; color:var(--dim); background:var(--input);
    border:1px solid var(--line); border-right:0; padding:2px 7px; cursor:pointer;
  }
  .modes button:first-child { border-radius:3px 0 0 3px; }
  .modes button:last-child { border-right:1px solid var(--line); border-radius:0 3px 3px 0; }
  .modes button:hover { color:var(--text); }
  .modes button.on { color:#FFF; background:var(--accent); border-color:var(--accent); }

  /* ----------------------------- visionneuse ---------------------------- */
  #viewer {
    position:fixed; left:0; right:0; top:0; bottom:0; background:rgba(0,0,0,.94);
    display:none; flex-direction:column; z-index:20;
  }
  #viewer.on { display:flex; }
  #viewer .vbody { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:10px; }
  #viewer img, #viewer video { max-width:100%; max-height:100%; }
  #viewer .vmsg { color:var(--dim); font-size:11px; text-align:center; line-height:1.8; padding:0 18px; }
  #viewer .vbar { flex:0 0 auto; display:flex; gap:5px; align-items:center; padding:6px 8px; background:var(--panel); border-top:1px solid var(--line); }
  #viewer .vname { flex:1; min-width:0; font-size:10.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* --------------------------- overlay download ------------------------- */
  .overlay {
    position:fixed; left:0; right:0; top:0; bottom:0; background:rgba(0,0,0,.6);
    display:none; align-items:flex-start; justify-content:center; z-index:30; padding:10px;
  }
  .overlay.on { display:flex; }
  .card {
    width:100%; max-width:420px; background:var(--bg); border:1px solid var(--line);
    border-radius:4px; padding:12px; box-shadow:0 14px 46px rgba(0,0,0,.6);
    max-height:100%; overflow:auto;
  }
  .card h2 {
    display:flex; align-items:center; font-size:11px; font-weight:600;
    letter-spacing:.4px; text-transform:uppercase; color:var(--dim);
  }
  .card h2 .x { margin-left:auto; }
  label.t {
    display:block; font-size:9.5px; font-weight:600; letter-spacing:.7px;
    text-transform:uppercase; color:var(--dim); margin:11px 0 4px;
  }
  input#url, .cutrow input {
    width:100%; font:inherit; color:var(--text); background:var(--input);
    border:1px solid var(--line); border-radius:3px; padding:5px 7px; outline:none;
  }
  input#url:focus, .cutrow input:focus { border-color:var(--accent); }
  input#url::placeholder { color:var(--faint); }
  .seg { display:grid; gap:4px; }
  .seg button {
    font:inherit; color:var(--text); background:var(--panel);
    border:1px solid var(--line); border-radius:3px; padding:5px 8px; cursor:pointer;
    text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .seg button:hover { background:var(--row-h); }
  .seg button.on { background:var(--accent); border-color:var(--accent); color:#FFF; }
  .check { display:flex; align-items:center; gap:6px; margin-top:11px; cursor:pointer; }
  .check input { accent-color:var(--accent); width:13px; height:13px; }
  .cutrow { display:flex; align-items:center; gap:6px; margin-top:6px; }
  .cutrow input { flex:1; min-width:0; }
  .cutrow .arrow { color:var(--dim); display:flex; }
  .cta {
    width:100%; margin-top:13px; font:inherit; font-size:11.5px; font-weight:600;
    color:#FFF; background:var(--accent); border:0; border-radius:3px;
    padding:7px; cursor:pointer;
  }
  .cta:hover { background:var(--accent-h); }
  .cta:disabled { opacity:.4; cursor:default; }
  .btn {
    width:100%; margin-top:5px; font:inherit; color:var(--text);
    background:var(--panel); border:1px solid var(--line); border-radius:3px;
    padding:6px; cursor:pointer;
  }
  .btn:hover { background:var(--row-h); }
  .bar-pg { height:3px; border-radius:2px; background:var(--input); overflow:hidden; margin-top:11px; }
  .bar-pg i { display:block; height:100%; width:0; background:var(--accent); transition:width .25s; }
  .bar-pg.indet i { width:30% !important; animation:indet 1.1s ease-in-out infinite alternate; }
  @keyframes indet { from { transform:translateX(-40%); } to { transform:translateX(280%); } }
  #status { margin-top:7px; color:var(--dim); font-size:11px; line-height:1.55; word-break:break-word; }
  #status.ok { color:var(--green); }
  #status.err { color:var(--red); }
  .foot { margin-top:11px; font-size:9.5px; color:var(--faint); }
  .foot a { color:var(--dim); }
  .foot a:hover { color:var(--text); }
</style>
</head>
<body>

<div class="titlebar">
  <span class="ttl">Mudkit</span>
  <span class="sp"></span>
  <button id="pick" class="ghost" title="Ajouter un dossier"><svg class="ic" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button id="forget" class="ghost" title="Retirer le dossier sélectionné"><svg class="ic" viewBox="0 0 16 16"><path d="M3.4 8h9.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button id="rescan" class="ghost" title="Rescanner"><svg class="ic" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12.9 2.3v2.9h-2.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="dl" class="pill"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2.6v7.2M5.1 7l2.9 2.9L10.9 7M3.2 12.9h9.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Télécharger</button>
</div>

<div class="main">
  <div class="side" id="side">
    <div class="sidetop">
      <button id="favfilter" class="ghost star" title="Afficher seulement les favoris"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2.2l1.75 3.54 3.91.57-2.83 2.76.67 3.89L8 11.13l-3.5 1.83.67-3.89L2.34 6.31l3.91-.57z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      <div class="searchwrap">
        <svg class="ic" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.2 10.2l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" class="search" type="text" spellcheck="false" placeholder="Rechercher">
      </div>
    </div>
    <div class="kinds" id="kinds">
      <button data-k="all" class="on" title="Tous les types">Tout</button>
      <button data-k="audio" title="Sons"><svg class="ic" viewBox="0 0 16 16"><path d="M6.4 11V4.2l5.2-1.1v6.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="4.9" cy="11.2" r="1.7" fill="currentColor"/><circle cx="10.1" cy="9.9" r="1.7" fill="currentColor"/></svg></button>
      <button data-k="video" title="Vidéos"><svg class="ic" viewBox="0 0 16 16"><path d="M5.2 3.4l7.2 4.6-7.2 4.6z" fill="currentColor"/></svg></button>
      <button data-k="image" title="Images"><svg class="ic" viewBox="0 0 16 16"><rect x="2" y="3.2" width="12" height="9.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="6.4" r="1.1" fill="currentColor"/><path d="M2.6 11.6l3.3-3.1 2.4 2.1 2.3-2.1 2.8 3.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
      <button data-k="mogrt" title="Motion Graphics Templates"><svg class="ic" viewBox="0 0 16 16"><path d="M8 2.3l5.7 5.7L8 13.7 2.3 8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 5.5L10.5 8 8 10.5 5.5 8z" fill="currentColor"/></svg></button>
    </div>
    <div class="tree" id="tree"></div>
  </div>
  <div class="split" id="split"></div>
  <div class="content">
    <div id="grid"></div>
  </div>
</div>

<div class="statusbar">
  <input id="size" type="range" min="72" max="260" value="116" title="Taille des vignettes">
  <span id="libstatus" class="msg">Ajoute un dossier avec le bouton +</span>
  <div class="modes" id="libact" title="Action du double-clic">
    <button data-v="insert" class="on">insérer</button>
    <button data-v="overwrite">écraser</button>
    <button data-v="bin">chutier</button>
  </div>
  <input id="vol" type="range" min="0" max="100" value="70" title="Volume">
</div>

<div id="viewer">
  <div class="vbody" id="vbody"></div>
  <div class="vbar">
    <div class="vname" id="vname"></div>
    <button class="ghost" id="vadd" title="Importer dans Premiere"><svg class="ic" viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button class="ghost" id="vclose" title="Fermer"><svg class="ic" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
</div>

<div id="dloverlay" class="overlay">
  <div class="card">
    <h2>Télécharger un média
      <button class="ghost x" id="dlclose"><svg class="ic" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </h2>

    <label class="t">Lien</label>
    <input id="url" type="text" spellcheck="false" placeholder="Colle un lien — YouTube, TikTok…">

    <label class="t">Format</label>
    <div class="seg" id="seg">
      <button data-v="h264" class="on">MP4 · 1080p montage (H.264)</button>
      <button data-v="max">MP4 · qualité max (4K, converti si besoin)</button>
      <button data-v="mp3">MP3 · audio seul</button>
    </div>

    <label class="check">
      <input type="checkbox" id="cut">
      Passage seulement (début → fin)
    </label>
    <div id="cutrow" class="cutrow hidden">
      <input id="t-in" type="text" spellcheck="false" placeholder="0:00">
      <span class="arrow"><svg class="ic" viewBox="0 0 16 16"><path d="M3 8h10M9.4 4.4L13 8l-3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <input id="t-out" type="text" spellcheck="false" placeholder="1:30">
    </div>

    <label class="t">À l'import</label>
    <div class="seg" id="act">
      <button data-v="insert" class="on">Timeline · insérer au curseur</button>
      <button data-v="overwrite">Timeline · écraser au curseur</button>
      <button data-v="bin">Chutier « Mudkit » seulement</button>
    </div>

    <button id="go" class="cta">Télécharger et importer</button>
    <button id="cancel" class="btn hidden">Annuler</button>

    <div class="bar-pg hidden" id="bar"><i></i></div>
    <div id="status"></div>

    <div class="foot">Fichiers dans Vidéos\Mudkit\Premiere ·
      <a id="upd" href="#">MàJ yt-dlp</a></div>
  </div>
</div>

<script src="panel.js"></script>
<script src="library.js"></script>
</body>
</html>
